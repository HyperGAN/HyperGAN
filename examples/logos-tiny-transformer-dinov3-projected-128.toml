# 128px logos with the two-block tiny transformer generator and DINOv3 projected critic.
# Uses ParticleGAN defaults (bispf_optimized, dualnorm, deterministic_orthogonal).
schema_version = 1
name = "images/logos-tiny-transformer-dinov3-projected-128"
defaults = "particlegan"

[data]
factory = "hypergan.colorization_data:ColorizationData"
[data.args]
root = "/mnt/ml7tb/data/logos256"
manifest = "./dataset-manifest-128.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "train"
shuffle = true
bad_image_policy = "skip"
max_bad_images = 100
max_consecutive_bad_images = 8
cache_dir = "/mnt/ml7tb/hypergan-cache/logos-128"

[components.generator]
factory = "hndl"
inputs = { z = "latent" }
[components.generator.args]
input_shape = ["B", 128]
output_shape = ["B", 3, 128, 128]
file = "networks/tiny-transformer-generator-128.hndl"

[components.discriminator]
factory = "hndl"
inputs = { x = "candidate" }
[components.discriminator.args]
input_shape = ["B", 3, 128, 128]
output_shape = ["B", 1]
file = "networks/dinov3-projected-discriminator-128.hndl"
[components.discriminator.args.parameters]
weights_path = "/path/to/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"
weights_sha256 = "08c60483bc63c04f533611e34bf70b120eedb7240f469bc16e9e20bf344b941d"
[components.discriminator.args.pretrained_providers.dinov3_vits16]
source_path = "/path/to/dinov3"
source_commit = "6876159a11b4df116f30f667f8c9888617df0751"

[prior]
kind = "particles"
initialization_device = "cpu"
initialization_seed = 2
[prior.args]
num_particles = 65536
z_dim = 128

[prior_regularizer]
rows = "sampled_unique"

[training]
steps = 200000
batch_size = 64
seed = 0
initialization = "deterministic_orthogonal"
device = "cuda:0"
phase_draws = "independent"
data_rng_device = "cpu"
data_seed_offset = 2
prior_seed_offset = 3

[training.backend]
deterministic_algorithms = true
cudnn_deterministic = true
cudnn_benchmark = false
matmul_allow_tf32 = false
cudnn_allow_tf32 = false
cublas_workspace_config = ":4096:8"

[sampling]
count = 16
seed = 10000

[metrics]
preset = "standard"
every_steps = 10
