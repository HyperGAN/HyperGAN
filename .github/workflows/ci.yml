name: Foundation CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit validated by the release workflow
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lightweight:
    name: Lightweight (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Foldlite DB dependency
        env:
          FOLDLITEDB_SOURCE: ${{ vars.FOLDLITEDB_SOURCE }}
        run: python .github/scripts/install_foldlitedb.py
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build>=1,<2"
          python -m build
      - name: Install the wheel with only test dependencies
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[test]'])"
      - name: Verify clean lightweight environment
        working-directory: ${{ runner.temp }}
        run: python -I -c "import importlib.util; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('particlegan') is None"
      - name: Test installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests/foundation" --import-mode=importlib
      - name: Verify source distribution rebuild
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          with tarfile.open(next(pathlib.Path('dist').glob('*.tar.gz'))) as archive:
              rel_paths = []
              for name in archive.getnames():
                  parts = pathlib.PurePosixPath(name).parts[1:]
                  rel_paths.append('/'.join(parts))
                  assert not any(part in {'needs_pytorch', 'worktrees'} for part in parts), name
                  assert not parts or parts[0] not in {'hypergan', 'docs'}, name
                  if parts and parts[0] == 'tests' and len(parts) > 1:
                      assert parts[1] in {'foundation', 'reference', 'cuda', 'reducers', 'browser', 'web', 'unit', 'playbooks', 'e2e', 'e2e_integration', 'fixtures', 'hndl_fixtures.py', 'dinov3_fixtures.py', 'distributed_fixtures.py', 'config_fixtures.py'}, name
              for required in ('src/hypergan/models', 'tests/unit', 'tests/playbooks', 'tests/e2e', 'tests/e2e_integration', 'tests/distributed_fixtures.py', 'tests/config_fixtures.py'):
                  assert any(p == required or p.startswith(required + '/') for p in rel_paths), required
          PY
          python -c "import pathlib, subprocess, sys; source = next(pathlib.Path('dist').glob('*.tar.gz')); subprocess.check_call([sys.executable, '-m', 'pip', 'wheel', '--no-deps', '--wheel-dir', 'rebuilt', str(source)])"

  reference:
    name: CPU reference (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Foldlite DB dependency
        env:
          FOLDLITEDB_SOURCE: ${{ vars.FOLDLITEDB_SOURCE }}
        run: python .github/scripts/install_foldlitedb.py
      - name: Install tested CPU runtime and build
        run: |
          python -m pip install "build>=1,<2" "httpx>=0.28,<0.29"
          python -m pip install "torch==2.14.0" "torchvision==0.29.0" --index-url https://download.pytorch.org/whl/cpu
          python -m build
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[train,image,cifar,fid,web,test]'])"
      - name: Verify InceptionFID under Scipy and Torch-Fidelity
        working-directory: ${{ runner.temp }}
        run: python -I -c "from hypergan.image_metrics import InceptionFID; print('InceptionFID verified')"
      - name: Test numerical reference outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests/reference" "${{ github.workspace }}/tests/unit" "${{ github.workspace }}/tests/playbooks" "${{ github.workspace }}/tests/e2e" --import-mode=importlib

  # The two jobs below run the half that `addopts` deselects: tests marked
  # `heavy` because they start real subprocesses, worker services or multi-rank
  # jobs. Run these for master pushes, PRs targeting master, and release validation;
  # develop uses the fast selection. Both selections remain available locally.
  heavy-lightweight:
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || inputs.source_ref != ''
    name: Heavy lightweight (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Foldlite DB dependency
        env:
          FOLDLITEDB_SOURCE: ${{ vars.FOLDLITEDB_SOURCE }}
        run: python .github/scripts/install_foldlitedb.py
      - name: Build the wheel
        run: |
          python -m pip install "build>=1,<2"
          python -m build --wheel
      - name: Install the wheel with only test dependencies
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[test]'])"
      - name: Verify clean lightweight environment
        working-directory: ${{ runner.temp }}
        run: python -I -c "import importlib.util; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('particlegan') is None"
      - name: Run the gated heavy foundation tests
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests/foundation" --import-mode=importlib -m heavy

  heavy-reference:
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || inputs.source_ref != ''
    name: Heavy CPU reference (Python 3.12)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Foldlite DB dependency
        env:
          FOLDLITEDB_SOURCE: ${{ vars.FOLDLITEDB_SOURCE }}
        run: python .github/scripts/install_foldlitedb.py
      - name: Install tested CPU runtime and build
        run: |
          python -m pip install "build>=1,<2"
          python -m pip install "torch==2.14.0" "torchvision==0.29.0" --index-url https://download.pytorch.org/whl/cpu
          python -m build
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[train,image,cifar,fid,test]'])"
      - name: Run the gated heavy reference tests
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests/reference" "${{ github.workspace }}/tests/unit" "${{ github.workspace }}/tests/e2e" --import-mode=importlib -m heavy

  reducers:
    name: Shared reducer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Foldlite DB dependency
        env:
          FOLDLITEDB_SOURCE: ${{ vars.FOLDLITEDB_SOURCE }}
        run: python .github/scripts/install_foldlitedb.py
      - name: Build and install the optional reducer runtime
        run: |
          python -m pip install "build>=1,<2"
          python -m build
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[reducers,web,test]'])"
      - name: Test packaged shared reducer outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests/reducers" "${{ github.workspace }}/tests/e2e_integration" --import-mode=importlib
      # Foldlite DB owns Rust source and reproducible WASM build qualification.
      - name: Install browser proof dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install "playwright==1.63.0"
          python -m playwright install --with-deps --only-shell chromium
      - name: Prove historical bootstrap and live browser continuation
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests/browser" --import-mode=importlib

  web:
    name: Viewer API (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Foldlite DB dependency
        env:
          FOLDLITEDB_SOURCE: ${{ vars.FOLDLITEDB_SOURCE }}
        run: python .github/scripts/install_foldlitedb.py
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "22"
      - name: Verify reproducible offline chart bundle
        if: runner.os == 'Linux'
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run check
      - name: Build and install optional viewer
        run: |
          python -m pip install "build>=1,<2" "httpx>=0.28,<0.29"
          python -m build
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[web,test]'])"
      - name: Exercise public API and local service outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/.github/scripts/pytest_exit_diagnostics.py" "${{ github.workspace }}/tests/web" --import-mode=importlib -vv -o faulthandler_timeout=60

  foundation:
    name: Foundation CI
    if: always()
    needs: [lightweight, reference, heavy-lightweight, heavy-reference, reducers, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every foundation job
        env:
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight.result }}
          REFERENCE_RESULT: ${{ needs.reference.result }}
          HEAVY_REQUIRED: ${{ github.ref == 'refs/heads/master' || github.base_ref == 'master' || inputs.source_ref != '' }}
          HEAVY_LIGHTWEIGHT_RESULT: ${{ needs['heavy-lightweight'].result }}
          HEAVY_REFERENCE_RESULT: ${{ needs['heavy-reference'].result }}
          REDUCERS_RESULT: ${{ needs.reducers.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          test "$LIGHTWEIGHT_RESULT" = success
          test "$REFERENCE_RESULT" = success
          if [ "$HEAVY_REQUIRED" = true ]; then
            test "$HEAVY_LIGHTWEIGHT_RESULT" = success
            test "$HEAVY_REFERENCE_RESULT" = success
          else
            test "$HEAVY_LIGHTWEIGHT_RESULT" = skipped
            test "$HEAVY_REFERENCE_RESULT" = skipped
          fi
          test "$REDUCERS_RESULT" = success
          test "$WEB_RESULT" = success

  distributions:
    name: Build release distributions
    needs: [foundation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install "build>=1,<2" "twine>=6,<8"
      - name: Build source archive and wheel
        run: python -m build
      - name: Verify distribution contents and stamped provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import tarfile
          import zipfile

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)

          with zipfile.ZipFile(wheels[0]) as archive:
              roots = {name.split("/")[0] for name in archive.namelist()}
              assert all(root == "hypergan" or root.endswith(".dist-info") for root in roots), roots
              prov = json.loads(archive.read("hypergan/_build_provenance.json").decode("utf-8"))
              assert prov == {"schema_version": 1, "commit": head, "dirty": False}, prov

          forbidden = {"docs", "reports", "runs", "samples", "worktrees", ".agents", ".claude", "needs_pytorch"}
          with tarfile.open(sdists[0]) as archive:
              roots = {parts[1] for name in archive.getnames() if len(parts := name.split("/")) > 1}
              assert not (roots & forbidden), roots & forbidden
              prov_member = next(name for name in archive.getnames() if name.endswith("src/hypergan/_build_provenance.json"))
              sdist_prov = json.loads(archive.extractfile(prov_member).read().decode("utf-8"))
              assert sdist_prov == {"schema_version": 1, "commit": head, "dirty": False}, sdist_prov
          PY
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - name: Save tested release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
