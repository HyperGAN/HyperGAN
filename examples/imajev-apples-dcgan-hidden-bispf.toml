# HyperGAN model written by hypergan.api (hg.save). Train it with `hypergan train` or hg.train.
# Networks and data are referenced by import path; edit those modules, not copies.
# hg.save replaces this file only while it is unedited; after editing it here, load it with hg.load.
# body-sha256: 812a96ba43768c05388d095aa94f16e7e13c63a4c436cc31279e908e2e011cb2

format = "hypergan-model/1"
name = "constraints/imajev-apples-dcgan-64-hidden-bispf"
defaults = "particlegan"

[networks.image_generator]
role = "auxiliary"
inputs = { x = "latent" }
hndl = "networks/dcgan-generator-64.hndl"
input_shape = ["B", 128]
output_shape = ["B", 3, 64, 64]

[networks.generator]
role = "generator"
inputs = { x = "components.image_generator" }
hndl = "networks/imajev-hidden-head.hndl"
input_shape = ["B", 3, 64, 64]
output_shape = ["B", 2560]

[networks.generator.args.parameters]
readout_path = "/path/to/imajev/artifacts/imajev-4b/decision_readout.pt"
readout_sha256 = "7a98c7aac7c0f648ac2fdfd563dc6ccce4cdf4e81b47c6a6a0dae1725b409326"

[networks.generator.args.pretrained_providers.imajev_4b]
base_model_path = "/path/to/Qwen3.5-4B"
adapter_path = "/path/to/imajev/artifacts/imajev-4b"
image_size = 128
compile = true
target_layer = -1
question = "What is the main subject shown in this image?"
options = ["a single red apple", "an orange citrus fruit", "a yellow banana", "random noise, static, checkerboard pattern, or solid color"]

[networks.discriminator]
role = "critic"
inputs = { x = "candidate" }
source = """
linear(128)
leaky_relu(0.2)
linear(64)
leaky_relu(0.2)
linear(1)
"""
input_shape = ["B", 2560]
output_shape = ["B", 1]

[data]
factory = "hypergan.constraint_data:ConstraintHiddenTargetData"

[data.args]
target_probs = [0.992, 0.002, 0.002, 0.002, 0.002]
hidden_dim = 2560
jitter_std = 0.05
null_std = 0.0

[prior]
kind = "particles"
initialization_device = "cpu"
initialization_seed = 25003
num_particles = 512
z_dim = 128

[train]
steps = 2000
batch_size = 16
seed = 25002
device = "cuda:0"
phase_draws = "shared"

[train.backend]
deterministic_algorithms = false
cudnn_deterministic = false
cudnn_benchmark = true
matmul_allow_tf32 = true
cudnn_allow_tf32 = true

[sampling]
count = 16
seed = 35002
output = "components.image_generator"

[metrics]
preset = "standard"
every_steps = 5

[[losses]]
type = "adversarial"
critic = "discriminator"
weight = 1.0

[[losses]]
type = "objective"
id = "tv_smoothness"
fn = "hypergan.constraint_data:TotalVariationSmoothness"
weight = 0.05

[losses.inputs]
image = "components.image_generator"

[[losses]]
type = "objective"
id = "apple_prob"
fn = "hypergan.constraint_data:OptionProbability"
weight = 1.0
detach = ["logits"]

[losses.inputs]
logits = "generated"

[losses.args]
index = 0
input_mode = "hidden_state"
num_classes = 5

[[losses]]
type = "objective"
id = "orange_prob"
fn = "hypergan.constraint_data:OptionProbability"
weight = 1.0
detach = ["logits"]

[losses.inputs]
logits = "generated"

[losses.args]
index = 1
input_mode = "hidden_state"
num_classes = 5

[[losses]]
type = "objective"
id = "noise_prob"
fn = "hypergan.constraint_data:OptionProbability"
weight = 1.0
detach = ["logits"]

[losses.inputs]
logits = "generated"

[losses.args]
index = 3
input_mode = "hidden_state"
num_classes = 5

[[losses]]
type = "objective"
id = "unknown_prob"
fn = "hypergan.constraint_data:OptionProbability"
weight = 1.0
detach = ["logits"]

[losses.inputs]
logits = "generated"

[losses.args]
index = 4
input_mode = "hidden_state"
num_classes = 5
