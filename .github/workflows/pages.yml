name: Build and Deploy GitHub Pages

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & verify documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            site/requirements.txt

      - name: Install Foldlite DB dependency
        env:
          FOLDLITEDB_SOURCE: ${{ vars.FOLDLITEDB_SOURCE }}
        run: python .github/scripts/install_foldlitedb.py

      - name: Install CPU PyTorch, HNDL, site generator, and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "hndl>=0.12.0,<1"
          python -m pip install -r site/requirements.txt
          python -m pip install --no-deps -e .

      - name: Run documentation site unit tests
        run: python -m unittest discover -s tests -p test_docs_site.py

      - name: Build and strictly verify static site
        run: python site/build.py --out _site --strict

      - name: Configure GitHub Pages
        if: github.repository == 'HyperGAN/HyperGAN'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.repository == 'HyperGAN/HyperGAN' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
