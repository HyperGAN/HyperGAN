# Whitepaper Benchmark 2/8: CIFAR-10 32x32 OG Radford BN-DCGAN — Honest Adam + R1 Baseline
# Architecture: Exact same Radford et al. (2015) BatchNorm DCGAN as cifar10-dcgan-bn-v12.toml.
# Formulation: Standard Non-Saturating Logistic GAN + Mescheder R1 penalty (gamma=1.0) + PyTorch Adam
#              (lr=0.0002, betas=[0.5, 0.999], EMA=0.999, isotropic Gaussian prior N(0, I)).
format = "hypergan-model/1"
name = "whitepaper/cifar10-dcgan-bn-adam"
description = "CIFAR-10 32x32 Radford BN-DCGAN trained with honest standard Adam (lr=2e-4, betas=[0.5, 0.999]) + R1 baseline."
defaults = "hypergan"

[recipe]
name = "adam_r1_baseline"
critic_formulation = "k3p"
optimizer_family = "adam"
loss = "non_saturating"
reg_arm = "a_r1r2"
reg_real_weight = 1.0
reg_fake_weight = 0.0
direct_particle_gain = false
prior_regularizer = "none"
prior_update = "frozen"

[data]
builtin = "cifar10"
args = { root = "~/.hypergan/cache/cifar10", split = "train", sampling = "random", horizontal_flip = true }

[prior]
kind = "gaussian"
z_dim = 128

[networks.generator]
role = "generator"
inputs = { z = "latent" }
input_shape = ["B", 128]
output_shape = ["B", 3, 32, 32]
source = """
# OG Radford (2015) BN-DCGAN Generator (32x32)
# linear(4096) -> reshape(256, 4, 4) -> BN -> ReLU -> 3x stride-2 deconv (BN+ReLU on hidden stages) -> tanh
linear(4096, bias=False, name="g_fc")
reshape(256, 4, 4)
batch_norm(name="g_bn0")
relu()
deconv(128, kernel_size=4, stride=2, padding=1, bias=False, name="g_deconv1")
batch_norm(name="g_bn1")
relu()
deconv(64, kernel_size=4, stride=2, padding=1, bias=False, name="g_deconv2")
batch_norm(name="g_bn2")
relu()
deconv(3, kernel_size=4, stride=2, padding=1, name="g_deconv3")
tanh()
"""

[networks.discriminator]
role = "critic"
inputs = { x = "candidate" }
input_shape = ["B", 3, 32, 32]
output_shape = ["B", 1]
source = """
# OG Radford (2015) BN-DCGAN Discriminator (32x32)
# conv(64) -> LReLU -> conv(128)+BN -> LReLU -> conv(256)+BN -> LReLU -> flatten -> linear(1)
conv(64, kernel_size=4, stride=2, padding=1, name="d_conv1")
leaky_relu(0.2)
conv(128, kernel_size=4, stride=2, padding=1, bias=False, name="d_conv2")
batch_norm(name="d_bn2")
leaky_relu(0.2)
conv(256, kernel_size=4, stride=2, padding=1, bias=False, name="d_conv3")
batch_norm(name="d_bn3")
leaky_relu(0.2)
flatten()
linear(1, name="d_score")
"""

[[losses]]
type = "adversarial"
critic = "discriminator"
weight = 1.0
penalty = 1.0

[penalty]
anchor_weight = 0.0
lazy_k = 1

[train]
steps = 100000
batch_size = 256
seed = 0
device = "cuda"
initialization = "deterministic_orthogonal"
implementation = "torch_fused_adam"
lr = 0.0002
d_lr_mult = 1.0
betas = [0.5, 0.999]
ema = 0.999
lr_floor = 1.0
network_lr_floor = 1.0
d_guard_ratio = 0.0
latent_damping_max_rate = 0.0
input_noise_std = 0.0
output_noise_std = 0.0
output_noise_warmup = 0.0
phase_draws = "independent"
data_rng_device = "execution"
data_seed_offset = 2
prior_seed_offset = 3

[train.backend]
deterministic_algorithms = false
cudnn_deterministic = false
cudnn_benchmark = true
matmul_allow_tf32 = true
cudnn_allow_tf32 = true

[run]
checkpoint_every = 5000
preview_every = 5000
progress_every = 100

[checkpoints]
keep_last = 3
keep_every = 25000
keep_best = { metric = "fid50k_train", mode = "min", count = 2 }
export_bundle = "on_eval"

[sampling]
count = 64
seed = 123

[metrics]
preset = "standard"
every_steps = 10

[evaluations.fid50k_train]
factory = "hypergan.image_metrics:InceptionFID"
inputs = { generated = "generated", reference = "reference" }
every = 10000
timeout = 3600
on_error = "fail"
on_busy = "skip"
device = "cuda"
samples = 50000
batch_size = 128
seed = 34002

[evaluations.fid50k_train.args]
weights_path = "https://github.com/toshas/torch-fidelity/releases/download/v0.2.0/weights-inception-2015-12-05-6726825d.pth"
weights_sha256 = "6726825d0af5f729cebd5821db510b11b1cfad8faad88a03f1befd49fb9129b2"

[evaluations.fid50k_train.data]
builtin = "cifar10"
args = { root = "~/.hypergan/cache/cifar10", split = "train", sampling = "sequential", horizontal_flip = false }

# Live manual publication multi-metric suites (invoke via `hypergan eval <run_dir> --metric inception_suite|dinov2_suite`
# or post-hoc on exported model.pt bundles via `python -m hypergan.image_metrics`).
[evaluations.inception_suite]
factory = "hypergan.image_metrics:InceptionSuite"
inputs = { generated = "generated", reference = "reference" }
timeout = 3600
on_error = "fail"
device = "cuda"
samples = 50000
batch_size = 128
seed = 34002
data = "train"

[evaluations.dinov2_suite]
factory = "hypergan.image_metrics:DINOv2Suite"
inputs = { generated = "generated", reference = "reference" }
timeout = 3600
on_error = "fail"
device = "cuda"
samples = 50000
batch_size = 128
seed = 34002
data = "train"
