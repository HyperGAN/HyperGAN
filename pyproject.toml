[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergan"
dynamic = ["version"]
description = "Train and deploy proven GAN recipes with reproducible workflows."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
# Keep the version classifiers equal to the CI lightweight matrix
# (tests/foundation/test_repository_consistency.py checks both).
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["foldlitedb>=0.1.2,<0.2"]

[project.optional-dependencies]
train = ["hndl>=0.10.0,<1", "particlegan>=0.9.4,<0.10", "torch>=2.6,<3", "numpy>=1.26,<3", "safetensors>=0.8,<1"]
image = ["Pillow>=13.0.0,<14"]
cifar = ["torchvision>=0.21,<1", "Pillow>=13.0.0,<14"]
fid = ["torch-fidelity>=0.4.0,<0.5", "torchvision>=0.21,<1", "Pillow>=13.0.0,<14", "scipy>=1.10,<2.0"]
reducers = ["foldlitedb[reducers]>=0.1.2,<0.2"]
web = ["foldlitedb[reducers]>=0.1.2,<0.2", "starlette>=1.6,<2.0", "uvicorn>=0.53,<1.0"]
safetensors = ["safetensors>=0.8,<1"]
onnx = ["onnx>=1.16,<2.0"]
all = [
    "foldlitedb[reducers]>=0.1.2,<0.2",
    "hndl>=0.10.0,<1",
    "numpy>=1.26,<3",
    "onnx>=1.16,<2.0",
    "particlegan>=0.9.4,<0.10",
    "Pillow>=13.0.0,<14",
    "safetensors>=0.8,<1",
    "scipy>=1.10,<2.0",
    "starlette>=1.6,<2.0",
    "torch>=2.6,<3",
    "torch-fidelity>=0.4.0,<0.5",
    "torchvision>=0.21,<1",
    "uvicorn>=0.53,<1.0",
]
test = ["pytest>=8,<10"]
dev = ["build>=1,<2", "pytest>=8,<10"]

[project.scripts]
hypergan = "hypergan.cli:main"

[project.urls]
Homepage = "https://github.com/HyperGAN/HyperGAN"
Documentation = "https://github.com/HyperGAN/HyperGAN/tree/master/docs"
Repository = "https://github.com/HyperGAN/HyperGAN"
Changelog = "https://github.com/HyperGAN/HyperGAN/blob/master/changelog.md"
Issues = "https://github.com/HyperGAN/HyperGAN/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
"hypergan" = ["networks/*.hndl", "models/*.toml", "_build_provenance.json", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "web_assets/*.txt", "web_assets/*.json", "web_assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hypergan", "hypergan.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "hypergan.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/foundation", "tests/reference", "tests/unit", "tests/playbooks", "tests/e2e", "tests/e2e_integration"]
# The default selection is the fast suite: everything except `heavy`. A command
# line `-m` replaces the one below, so `python -m pytest -m heavy` runs exactly
# the gated tests and `-m ""` runs both halves together.
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "-m", "not heavy"]
markers = [
    # A test is heavy when it starts real operating system processes - a CLI
    # run, a worker service, a two-rank job, an acceptance driver - and takes a
    # second or more. Measure with `--durations=0` when adding one; the original
    # measurement is reports/test-durations-2026-09-20.txt. Nothing is marked
    # for sitting in a file next to one that is. Heavy tests are deselected by
    # default and never skipped: a default run reports them as deselected, not
    # as passing. `--collect-only -q -m heavy` prints the current count.
    "heavy: starts real subprocesses or multi-rank jobs; a second or more each",
    # tests/cuda only; scripts/rocm_preflight_helper.py defers these on one GPU.
    "multi_gpu: needs two or more visible GPUs",
]
