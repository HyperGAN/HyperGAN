# Show the CIFAR pg07/lr2e-4 recipe in the local viewer with a separate run.
# Use start-cifar-tiny-transformer-resnet-features-pg07-lr2e-4-demo.sh:
# it selects the ParticleGAN 0.7-compatible HyperGAN worktree and pg07 env.
# Original networks, defaults, seeds, schedule and FID protocols are preserved.
format = "hypergan-model/1"
name = "images/cifar-tiny-transformer-resnet-features-pg07-lr2e-4-demo"
defaults = "particlegan"

[data]
factory = "hypergan.image_data:CIFAR10Data"

[data.args]
root = "./data"
split = "train"
sampling = "random"
horizontal_flip = true

[networks.generator]
role = "generator"
inputs = { z = "latent" }
hndl = "networks/tiny-transformer-generator-32.hndl"
input_shape = ["B", 128]
output_shape = ["B", 3, 32, 32]

[networks.discriminator]
role = "critic"
inputs = { x = "candidate" }
hndl = "networks/resnet18-features-discriminator-32.hndl"
input_shape = ["B", 3, 32, 32]
output_shape = ["B", 1]

[networks.discriminator.args.parameters]
weights_path = "~/.cache/torch/hub/checkpoints/resnet18-f37072fd.pth"
weights_sha256 = "f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec"

[prior]
kind = "mog"
initialization_device = "cpu"
initialization_seed = 24003
fixed_sigma = 0.212616428732872
num_particles = 65536
z_dim = 128
sigma_rel = 0.025

[train]
steps = 200000
batch_size = 64
seed = 24002
device = "cuda"
phase_draws = "independent"
data_rng_device = "execution"
data_seed_offset = 2
prior_seed_offset = 3
implementation = "torch_fused_adam"
lr = 0.0002

[train.backend]
deterministic_algorithms = false
cudnn_deterministic = false
cudnn_benchmark = true
matmul_allow_tf32 = true
cudnn_allow_tf32 = true

[sampling]
count = 64
seed = 34002

[metrics]
preset = "standard"
every_steps = 1

[evaluations.fid_smoke]
factory = "hypergan.image_metrics:InceptionFID"
inputs = { generated = "generated", reference = "reference" }
timeout = 180
on_error = "fail"
device = "cuda"
samples = 128
batch_size = 128
seed = 34002

[evaluations.fid_smoke.args]
weights_path = "~/.cache/torch/hub/checkpoints/weights-inception-2015-12-05-6726825d.pth"
weights_sha256 = "6726825d0af5f729cebd5821db510b11b1cfad8faad88a03f1befd49fb9129b2"

[evaluations.fid_smoke.data]
factory = "hypergan.image_data:CIFAR10Data"

[evaluations.fid_smoke.data.args]
root = "./data"
split = "train"
sampling = "sequential"
horizontal_flip = false

[evaluations.fid50k_train]
factory = "hypergan.image_metrics:InceptionFID"
inputs = { generated = "generated", reference = "reference" }
every = 10000
timeout = 3600
on_error = "fail"
on_busy = "skip"
device = "cuda"
samples = 50000
batch_size = 128
seed = 34002

[evaluations.fid50k_train.args]
weights_path = "~/.cache/torch/hub/checkpoints/weights-inception-2015-12-05-6726825d.pth"
weights_sha256 = "6726825d0af5f729cebd5821db510b11b1cfad8faad88a03f1befd49fb9129b2"

[evaluations.fid50k_train.data]
factory = "hypergan.image_data:CIFAR10Data"

[evaluations.fid50k_train.data.args]
root = "./data"
split = "train"
sampling = "sequential"
horizontal_flip = false

[[losses]]
type = "adversarial"
critic = "discriminator"
weight = 1.0

[[losses]]
type = "prior"
rows = "full"
target_std = 1.0
eps = 0.0001
