# 128px logos using the working CIFAR tiny transformer / feature-only recipe.
# Both complete HNDL networks are embedded below; CIFAR latent/prior/optimizer retained.
schema_version = 1
name = "images/logos-tiny-transformer-resnet-features-128"

[data]
factory = "hypergan.colorization_data:ColorizationData"
[data.args]
root = "/mnt/ml7tb/data/logos256"
manifest = "./dataset-manifest-128.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "train"
shuffle = true

# Two-block transformer with convolutional upsampling to 128px.
[components.generator]
factory = "hndl"
inputs = { z = "latent" }
[components.generator.args]
input_shape = ["B", 64]
output_shape = ["B", 3, 128, 128]
source = '''
# CIFAR z=64 -> 64 spatial tokens; two pre-LayerNorm transformer blocks.
# Each position has its own projection weights, so no position table is needed.
h = linear(x, 16384, name="input_projection")
h = reshape(h, 64, 256)

branch = layer_norm(h, name="block0_attention_norm")
branch = attention(branch, 4, dropout=0.0, qkv_bias=True, out_bias=True, name="block0_attention")
h = add(h, branch)
branch = layer_norm(h, name="block0_ffn_norm")
branch = feed_forward(branch, 512, activation="gelu", dropout=0.0, name="block0_ffn")
h = add(h, branch)

branch = layer_norm(h, name="block1_attention_norm")
branch = attention(branch, 4, dropout=0.0, qkv_bias=True, out_bias=True, name="block1_attention")
h = add(h, branch)
branch = layer_norm(h, name="block1_ffn_norm")
branch = feed_forward(branch, 512, activation="gelu", dropout=0.0, name="block1_ffn")
h = add(h, branch)

# Plain nearest-neighbor upsampling and 3x3 convolutions: 8 -> 16 -> 32 -> 64 -> 128.
h = permute(h, 2, 1)
h = reshape(h, 256, 8, 8)
h = upsample(h, 2, mode="nearest")
h = conv(h, 128, kernel_size=3, padding=1, name="conv16")
h = leaky_relu(h, 0.2)
h = upsample(h, 2, mode="nearest")
h = conv(h, 64, kernel_size=3, padding=1, name="conv32")
h = leaky_relu(h, 0.2)
h = upsample(h, 2, mode="nearest")
h = conv(h, 32, kernel_size=3, padding=1, name="conv64")
h = leaky_relu(h, 0.2)
h = upsample(h, 2, mode="nearest")
h = conv(h, 16, kernel_size=3, padding=1, name="conv128")
h = leaky_relu(h, 0.2)
h = conv(h, 3, kernel_size=3, padding=1, name="rgb")
out = tanh(h)
'''

# Complete discriminator graph; architecture changes require a fresh run.
[components.discriminator]
factory = "hndl"
inputs = { x = "candidate" }
[components.discriminator.args]
input_shape = ["B", 3, 128, 128]
output_shape = ["B", 1]
source = '''
# Logo feature-only critic: frozen ResNet18 at native 128px, three trainable heads.
# Preserve CIFAR preprocessing, fixed context, and layer1/2/3 feature heads.
# No pixel discriminator. Normalize the three remaining scores by sqrt(3).
context = constant(x, 3, 128, 128)

# Join along batch before normalization: raw zero context is midgray RGB.
# ResNet preprocessing: (RGB * 0.5 + 0.5 - ImageNet mean) / std.
feature_batch = concat(x, context, axis=0, name="feature_batch")
# Full 128px input: no spatial resize before the pretrained backbone.
scaled = scale(feature_batch, 0.5)
half = constant(feature_batch, 3, 1, 1, value=0.5)
normalized = broadcast_add(scaled, half)
red, green_blue = split(normalized, 1)
green, blue = split(green_blue, 1)
red_bias = constant(red, 1, 1, 1, value=-0.485)
red = broadcast_add(red, red_bias)
red = scale(red, 4.3668122270742355)
green_bias = constant(green, 1, 1, 1, value=-0.456)
green = broadcast_add(green, green_bias)
green = scale(green, 4.464285714285714)
blue_bias = constant(blue, 1, 1, 1, value=-0.406)
blue = broadcast_add(blue, blue_bias)
blue = scale(blue, 4.444444444444445)
normalized = concat(red, green, blue, name="normalized")

# One frozen backbone, one pass at batch 2*B, native 32px / 16px / 8px maps.
# Frozen BatchNorm uses checkpoint statistics; examples remain independent.
feature1, feature2, feature3 = pretrained(normalized, ${weights_path},
    provider="torchvision_resnet18", sha256=${weights_sha256},
    layers=("layer1", "layer2", "layer3"), trainable=False, name="resnet")

# Candidate + fixed-context feature head 1, native 32px map.
candidate1, context1 = chunk(feature1, 2, dim=0, name="feature1_split")
head1 = concat(candidate1, context1, name="feature1_join")
head1 = conv(head1, 64, kernel_size=1, name="feature1_project")
head1 = group_norm(head1, 8, name="feature1_norm")
head1 = leaky_relu(head1, 0.2)
head1 = conv(head1, 64, kernel_size=3, padding=1, name="feature1_conv")
head1 = leaky_relu(head1, 0.2)
head1 = adaptive_avg_pool(head1, 4)
head1 = flatten(head1)
score1 = linear(head1, 1, name="feature1_score")

# Candidate + fixed-context feature head 2, native 16px map.
candidate2, context2 = chunk(feature2, 2, dim=0, name="feature2_split")
head2 = concat(candidate2, context2, name="feature2_join")
head2 = conv(head2, 64, kernel_size=1, name="feature2_project")
head2 = group_norm(head2, 8, name="feature2_norm")
head2 = leaky_relu(head2, 0.2)
head2 = conv(head2, 64, kernel_size=3, padding=1, name="feature2_conv")
head2 = leaky_relu(head2, 0.2)
head2 = adaptive_avg_pool(head2, 4)
head2 = flatten(head2)
score2 = linear(head2, 1, name="feature2_score")

# Candidate + fixed-context feature head 3, native 8px map.
candidate3, context3 = chunk(feature3, 2, dim=0, name="feature3_split")
head3 = concat(candidate3, context3, name="feature3_join")
head3 = conv(head3, 64, kernel_size=1, name="feature3_project")
head3 = group_norm(head3, 8, name="feature3_norm")
head3 = leaky_relu(head3, 0.2)
head3 = conv(head3, 64, kernel_size=3, padding=1, name="feature3_conv")
head3 = leaky_relu(head3, 0.2)
head3 = adaptive_avg_pool(head3, 4)
head3 = flatten(head3)
score3 = linear(head3, 1, name="feature3_score")

feature_score = concat(score1, score2, score3)
feature_score = sum(feature_score, 1, keepdim=True)
out = scale(feature_score, 0.5773502691896258)
'''
[components.discriminator.args.parameters]
weights_path = "~/.cache/torch/hub/checkpoints/resnet18-f37072fd.pth"
weights_sha256 = "f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec"

[prior]
kind = "mog"
initialization_device = "cpu"
initialization_seed = 24003
fixed_sigma = 0.212616428732872
[prior.args]
num_particles = 16384
z_dim = 64
sigma_rel = 0.025

[adversarial]
loss_type = "logistic"
mode = "rp"
weight = 1.0

[gradient_penalty]
arm = "b_cap"
coeff = 1.0
kappa = 1.0
lazy_k = 8

[prior_regularizer]
rows = "full"
weight = 1.0
target_std = 1.0
eps = 0.0001

[optimizer]
implementation = "torch_fused_adam"
lr = 0.0003
d_lr_mult = 1.5
prior_lr_mult = 10.0
betas = [0.0, 0.999]
prior_betas = [0.5, 0.999]

[training]
steps = 200000
batch_size = 64
seed = 24002
device = "cuda"
ema = 0.995
lr_anneal_start = 0.6
lr_floor = 1.0
phase_draws = "independent"
data_rng_device = "cpu"
data_seed_offset = 2
prior_seed_offset = 3

# Backend matched to the source: TF32 and cuDNN autotuning on, nondeterministic
# kernels allowed. Measured 2026-09-20 on an RTX A6000: 61 -> 41 ms/step against the
# strict deterministic policy in docs/cifar-recipe.md. Resume still restores the
# complete state; only bit-exact replay of a run is given up.
[training.backend]
deterministic_algorithms = false
cudnn_deterministic = false
cudnn_benchmark = true
matmul_allow_tf32 = true
cudnn_allow_tf32 = true

[sampling]
count = 64
seed = 34002

[metrics]
preset = "standard"
every_steps = 1

