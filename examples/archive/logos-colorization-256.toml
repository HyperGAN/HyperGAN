# Experimental conditional particle VAEGAN. See docs/colorization.md.
# Prepare a dataset manifest and supply local, hash-pinned ResNet18 weights.
format = "hypergan-model/1"
name = "images/logos-colorization-resnet-256"

[data]
factory = "hypergan.colorization_data:ColorizationData"

[data.args]
root = "./data/logos256"
manifest = "./dataset-manifest.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "train"
shuffle = true

[networks.generator]
role = "generator"
inputs = { z = "latent" }
module = "hypergan.colorization_components:ColorizationGenerator"
args = { z_dim = 128, width = 32 }

[networks.discriminator]
role = "critic"
inputs = { x = "candidate" }
module = "hypergan.image_components:CIFARDiscriminator"

[networks.discriminator.args]
weights_path = "./resnet18-f37072fd.pth"
weights_sha256 = "f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec"
width = 32
image_size = 256
feature_size = 256
deterministic_features = true

[networks.encoder]
role = "encoder"
inputs = { gray = "batch.gray", means = "prior.means", sigma = "prior.sigma" }
module = "hypergan.colorization_components:GrayscaleRoutingEncoder"
args = { z_dim = 128, width = 32, temperature = 0.125 }

[networks.reconstruction]
role = "auxiliary"
inputs = { z = "components.encoder.reconstruction_latent" }
freeze_parameters = true
reuse = "generator"

[networks.reconstruction_gray]
role = "auxiliary"
inputs = { x = "components.reconstruction" }
module = "hypergan.colorization_components:GrayscaleImage"

[prior]
kind = "mog"
initialization_device = "cpu"
initialization_seed = 25003
num_particles = 4096
z_dim = 128
sigma_rel = 0.025

[penalty]
kappa = 1.0
lazy_k = 8

[train]
steps = 200000
batch_size = 16
seed = 25002
device = "cuda"
ema = 0.995
lr_anneal_start = 0.6
lr_floor = 1.0
phase_draws = "independent"
data_rng_device = "cpu"
data_seed_offset = 2
prior_seed_offset = 3
implementation = "torch_fused_adam"
lr = 0.0003
d_lr_mult = 1.5
prior_lr_mult = 10.0
betas = [0.0, 0.999]
prior_betas = [0.5, 0.999]

[train.backend]
deterministic_algorithms = false
cudnn_deterministic = false
cudnn_benchmark = true
matmul_allow_tf32 = true
cudnn_allow_tf32 = true

[sampling]
count = 8
seed = 35002
particle_ids = "components.encoder.ids"
output = "components.reconstruction"

[sampling.views]
random = "components.generator"

[[sampling.comparison]]
label = "X"
binding = "batch.real"

[[sampling.comparison]]
label = "B"
binding = "batch.gray"

[[sampling.comparison]]
label = "X_hat"
binding = "components.reconstruction"

[metrics]
preset = "standard"
every_steps = 10

[evaluations.chroma]
factory = "hypergan.colorization_metrics:ChromaDistributionDistance"
args = { bins = 64, projections = 8 }
inputs = { generated = "generated", reference = "reference" }
every = 5000
timeout = 600
on_error = "fail"
on_busy = "skip"
device = "cuda"
samples = 512
batch_size = 8
seed = 35002

[evaluations.chroma.data]
factory = "hypergan.colorization_data:ColorizationData"

[evaluations.chroma.data.args]
root = "./data/logos256"
manifest = "./dataset-manifest.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "heldout"
shuffle = false
repeats = 1

[evaluations.structure]
factory = "hypergan.colorization_metrics:GrayscaleStructureDistance"
inputs = { generated = "generated", reference = "reference" }
every = 6000
timeout = 600
on_error = "fail"
on_busy = "skip"
device = "cuda"
samples = 512
batch_size = 8
seed = 35002

[evaluations.structure.data]
factory = "hypergan.colorization_data:ColorizationData"

[evaluations.structure.data.args]
root = "./data/logos256"
manifest = "./dataset-manifest.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "heldout"
shuffle = false
repeats = 1

[evaluations.diversity]
factory = "hypergan.colorization_metrics:RepeatedConditionChromaDiversity"
args = { repeats = 4 }
inputs = { generated = "generated", reference = "reference" }
every = 7000
timeout = 600
on_error = "fail"
on_busy = "skip"
device = "cuda"
samples = 512
batch_size = 8
seed = 35002

[evaluations.diversity.data]
factory = "hypergan.colorization_data:ColorizationData"

[evaluations.diversity.data.args]
root = "./data/logos256"
manifest = "./dataset-manifest.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "heldout"
shuffle = false
repeats = 4

[evaluations.random_spread]
factory = "hypergan.colorization_metrics:SampleDiversityRatio"
args = { pool_size = 32 }
inputs = { generated = "generated", reference = "reference" }
every = 250
timeout = 600
on_error = "fail"
on_busy = "skip"
device = "cuda"
samples = 256
batch_size = 8
seed = 35002
output = "generated"

[evaluations.random_spread.data]
factory = "hypergan.colorization_data:ColorizationData"

[evaluations.random_spread.data.args]
root = "./data/logos256"
manifest = "./dataset-manifest.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "heldout"
shuffle = false
repeats = 1

[evaluations.random_chroma]
factory = "hypergan.colorization_metrics:ChromaDistributionDistance"
args = { bins = 64, projections = 8 }
inputs = { generated = "generated", reference = "reference" }
every = 1100
timeout = 600
on_error = "fail"
on_busy = "skip"
device = "cuda"
samples = 512
batch_size = 8
seed = 35002
output = "generated"

[evaluations.random_chroma.data]
factory = "hypergan.colorization_data:ColorizationData"

[evaluations.random_chroma.data.args]
root = "./data/logos256"
manifest = "./dataset-manifest.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "heldout"
shuffle = false
repeats = 1

[[losses]]
type = "adversarial"
critic = "discriminator"
weight = 1.0
penalty = 1.0

[[losses]]
type = "objective"
id = "encoder_reconstruction"
fn = "mse"
weight = 1.0
detach = ["target"]

[losses.inputs]
input = "components.reconstruction_gray"
target = "batch.gray"

[[losses]]
type = "prior"
rows = "full"
weight = 1.0
target_std = 1.0
eps = 0.0001
