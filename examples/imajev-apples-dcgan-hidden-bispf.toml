# Data-less constraint GAN recipe using frozen ImaJev-4B hidden-state representation
# (D(imajev(x)[target_layer])) and ParticleGAN BISPF defaults with a 64x64 DCGAN generator.
schema_version = 1
name = "constraints/imajev-apples-dcgan-64-hidden-bispf"
defaults = "particlegan"

[data]
factory = "hypergan.constraint_data:ConstraintHiddenTargetData"
[data.args]
target_probs = [0.992, 0.002, 0.002, 0.002, 0.002]
hidden_dim = 2560
jitter_std = 0.05
null_std = 0.05

[components.image_generator]
factory = "hndl"
inputs = { x = "latent" }
[components.image_generator.args]
input_shape = ["B", 128]
output_shape = ["B", 3, 64, 64]
file = "networks/dcgan-generator-64.hndl"

[components.generator]
factory = "hndl"
inputs = { x = "components.image_generator" }
[components.generator.args]
input_shape = ["B", 3, 64, 64]
output_shape = ["B", 2560]
file = "networks/imajev-hidden-head.hndl"
[components.generator.args.parameters]
readout_path = "/nvme/dev/imajev/artifacts/imajev-4b/decision_readout.pt"
readout_sha256 = "7a98c7aac7c0f648ac2fdfd563dc6ccce4cdf4e81b47c6a6a0dae1725b409326"
[components.generator.args.pretrained_providers.imajev_4b]
base_model_path = "/nvme/dev/imajev/.cache/huggingface/hub/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
adapter_path = "/nvme/dev/imajev/artifacts/imajev-4b"
image_size = 128
compile = true
target_layer = -1
question = "What is the main subject shown in this image?"
options = [
  "a single red apple",
  "an orange citrus fruit",
  "a yellow banana",
  "random noise, static, checkerboard pattern, or solid color",
]

[components.discriminator]
factory = "hndl"
inputs = { x = "candidate" }
[components.discriminator.args]
input_shape = ["B", 2560]
output_shape = ["B", 1]
source = """
linear(128)
leaky_relu(0.2)
linear(64)
leaky_relu(0.2)
linear(1)
"""

[[objectives]]
id = "tv_smoothness"
factory = "hypergan.constraint_data:TotalVariationSmoothness"
inputs = { image = "components.image_generator" }
weight = 0.05

[[objectives]]
id = "apple_prob"
factory = "hypergan.constraint_data:OptionProbability"
inputs = { logits = "generated" }
detach = ["logits"]
weight = 1.0
args = { index = 0, input_mode = "hidden_state", num_classes = 5 }

[[objectives]]
id = "orange_prob"
factory = "hypergan.constraint_data:OptionProbability"
inputs = { logits = "generated" }
detach = ["logits"]
weight = 1.0
args = { index = 1, input_mode = "hidden_state", num_classes = 5 }

[[objectives]]
id = "noise_prob"
factory = "hypergan.constraint_data:OptionProbability"
inputs = { logits = "generated" }
detach = ["logits"]
weight = 1.0
args = { index = 3, input_mode = "hidden_state", num_classes = 5 }

[[objectives]]
id = "unknown_prob"
factory = "hypergan.constraint_data:OptionProbability"
inputs = { logits = "generated" }
detach = ["logits"]
weight = 1.0
args = { index = 4, input_mode = "hidden_state", num_classes = 5 }

[prior]
kind = "particles"
initialization_device = "cpu"
initialization_seed = 25003
[prior.args]
num_particles = 512
z_dim = 128

[training]
steps = 2000
batch_size = 16
seed = 25002
device = "cuda:0"
phase_draws = "shared"

[training.backend]
deterministic_algorithms = false
cudnn_deterministic = false
cudnn_benchmark = true
matmul_allow_tf32 = true
cudnn_allow_tf32 = true

[sampling]
generated = "components.image_generator"
count = 16
seed = 35002

[metrics]
preset = "standard"
every_steps = 5
