[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergan"
dynamic = ["version"]
description = "Train and deploy proven GAN recipes with reproducible workflows."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
train = ["hndl>=0.6.0", "particlegan==0.7.0", "torch>=2.6,<3", "numpy>=1.26,<3"]
image = ["Pillow>=11,<13"]
cifar = ["torchvision>=0.21,<1"]
fid = ["torch-fidelity==0.3.0", "torchvision>=0.21,<1", "scipy>=1.10,<1.18"]
reducers = ["wasmtime>=48,<49"]
web = ["wasmtime>=48,<49", "starlette>=1.6,<1.7", "uvicorn>=0.53,<0.54"]
test = ["pytest>=8,<10"]
dev = ["build>=1,<2", "pytest>=8,<10"]

[project.scripts]
hypergan = "hypergan.cli:main"

[project.urls]
Repository = "https://github.com/HyperGAN/HyperGAN"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
"hypergan.metrics_reducer" = ["assets/*.wasm", "assets/*.json", "assets/*.js", "assets/*.html", "assets/*.txt"]
"hypergan" = ["networks/*.hndl","_build_provenance.json", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "web_assets/*.txt", "web_assets/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hypergan", "hypergan.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "hypergan.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/foundation", "tests/reference"]
# The default selection is the fast suite: everything except `heavy`. A command
# line `-m` replaces the one below, so `python -m pytest -m heavy` runs exactly
# the gated tests and `-m ""` runs both halves together.
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "-m", "not heavy"]
markers = [
    # The criterion is one measured number: a test is heavy when it took a
    # second or more in reports/test-durations-2026-09-20.txt. Every test over
    # that line also starts real operating system processes - a CLI run, a
    # worker service, a two-rank job, an acceptance driver - so the two ways of
    # saying it pick out the same 180 tests. Nothing is marked for sitting in a
    # file next to one that is. Heavy tests are deselected by default and never
    # skipped: a default run reports them as deselected, not as passing.
    "heavy: starts real subprocesses or multi-rank jobs; a second or more each",
]
