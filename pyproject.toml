[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergan"
dynamic = ["version"]
description = "Train and deploy proven GAN recipes with reproducible workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["tomli>=2,<3; python_version < '3.11'"]

[project.optional-dependencies]
train = ["particlegan==0.5.0", "torch>=2.6,<3", "numpy>=1.26,<3"]
image = ["Pillow>=11,<13"]
reducers = ["wasmtime>=48,<49"]
web = ["wasmtime>=48,<49", "starlette>=1.6,<1.7", "uvicorn>=0.53,<0.54"]
test = ["pytest>=8,<10"]
dev = ["build>=1,<2", "pytest>=8,<10"]

[project.scripts]
hypergan = "hypergan.cli:main"

[project.urls]
Repository = "https://github.com/HyperGAN/HyperGAN"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
"hypergan.metrics_reducer" = ["assets/*.wasm", "assets/*.json", "assets/*.js", "assets/*.html", "assets/*.txt"]
"hypergan" = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "web_assets/*.txt", "web_assets/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hypergan", "hypergan.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "hypergan.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/foundation", "tests/reference"]
addopts = "--import-mode=importlib -ra"
