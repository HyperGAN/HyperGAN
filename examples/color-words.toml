# Eight noisy colors, one generator, one particle codebook. See docs/color-words.md.
# No CLIP, no second image generator, no token decoder.
format = "hypergan-model/1"
name = "images/color-words"

[data]
factory = "hypergan.color_words:ColorWords"

[data.args]
noise = 0.05

[networks.generator]
role = "generator"
inputs = { latent = "latent" }
module = "hypergan.color_words:ColorGenerator"
args = { z_dim = 16, width = 8 }

[networks.discriminator]
role = "critic"
inputs = { candidate = "candidate" }
module = "hypergan.color_words:ImageCritic"
args = { width = 8 }

[networks.image_encoder]
role = "encoder"
inputs = { image = "batch.real", means = "prior.means", sigma = "prior.sigma" }
module = "hypergan.color_words:ImageEncoder"
args = { z_dim = 16, width = 8, temperature = 0.125 }

[networks.reconstruction]
role = "auxiliary"
inputs = { latent = "components.image_encoder.latent" }
reuse = "generator"

[networks.text_encoder]
role = "encoder"
inputs = { label = "batch.label", means = "prior.means", sigma = "prior.sigma" }
module = "hypergan.color_words:TextEncoder"
args = { z_dim = 16, embed_dim = 16, temperature = 0.125 }

[networks.text_image]
role = "auxiliary"
inputs = { latent = "components.text_encoder.latent" }
reuse = "generator"

[networks.z_embedding]
role = "auxiliary"
inputs = { latent = "latent" }
module = "hypergan.color_words:ZEmbedding"
args = { z_dim = 16, embed_dim = 16 }

[networks.text_critic]
role = "critic"
inputs = { candidate = "candidate" }
module = "hypergan.color_words:TextCritic"
args = { embed_dim = 16, width = 16 }

[networks.joint_critic]
role = "critic"
inputs = { candidate = "candidate", embedding = "components.text_encoder.embedding" }
module = "hypergan.color_words:JointCritic"
args = { embed_dim = 16, width = 8 }

[prior]
kind = "mog"
initialization_device = "cpu"
initialization_seed = 25021
fixed_sigma = 0.05
num_particles = 64
z_dim = 16

[penalty]
kappa = 1.0
lazy_k = 1

[train]
steps = 200
batch_size = 16
seed = 25021
device = "cpu"
ema = 0.995
lr_anneal_start = 0.6
lr_floor = 1.0
phase_draws = "shared"
data_rng_device = "cpu"
data_seed_offset = 1
prior_seed_offset = 2
implementation = "device_adam"
lr = 0.0003
d_lr_mult = 1.5
prior_lr_mult = 10.0
betas = [0.0, 0.999]
prior_betas = [0.5, 0.999]

[sampling]
count = 8
seed = 35021

[metrics]
preset = "standard"
every_steps = 10

[[losses]]
type = "adversarial"
critic = "discriminator"
weight = 1.0
penalty = 1.0

[[losses]]
type = "adversarial"
critic = "discriminator"
weight = 1.0
real = "batch.real"
fake = "components.text_image"
id = "image-from-text"
penalty = 0.0

[[losses]]
type = "adversarial"
critic = "text_critic"
weight = 1.0
real = "components.text_encoder.embedding"
fake = "components.z_embedding"
id = "text-marginal"
penalty = 0.1

[[losses]]
type = "adversarial"
critic = "joint_critic"
weight = 1.0
real = "batch.real"
fake = "components.text_image"
id = "joint"
penalty = 0.1

[[losses]]
type = "objective"
id = "rgb-image"
fn = "mse"
weight = 1.0
detach = ["target"]

[losses.inputs]
input = "components.reconstruction"
target = "batch.real"

[[losses]]
type = "objective"
id = "rgb-text"
fn = "mse"
weight = 1.0
detach = ["target"]

[losses.inputs]
input = "components.text_image"
target = "batch.real"

[[losses]]
type = "objective"
id = "latent-text"
fn = "mse"
weight = 1.0
detach = ["target"]

[losses.inputs]
input = "components.text_encoder.latent"
target = "components.image_encoder.latent"

[[losses]]
type = "prior"
rows = "sampled_unique"
weight = 1.0
target_std = 1.0
eps = 0.0001
