name: Build HyperGAN GitBook preview

on:
  pull_request:
    branches: [develop, master]
    paths:
      - 'docs/**'
      - 'scripts/*gitbook_preview*'
      - 'tests/test_gitbook_preview.py'
      - '.github/workflows/gitbook-preview.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/*gitbook_preview*'
      - 'tests/test_gitbook_preview.py'
      - '.github/workflows/gitbook-preview.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_gitbook_preview.py
      - run: python3 scripts/build_gitbook_preview.py "$RUNNER_TEMP/gitbook-preview"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitbook-preview
          path: ${{ runner.temp }}/gitbook-preview
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: github.repository == 'HyperGAN/HyperGAN' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: gitbook-preview-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gitbook-preview
          path: ${{ runner.temp }}/gitbook-preview
      - run: bash scripts/publish_gitbook_preview.sh "$RUNNER_TEMP/gitbook-preview"
