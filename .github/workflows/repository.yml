name: Repository integrity
on:
  push:
    branches: [develop, master, 'resurrection/**']
  pull_request:
    branches: [develop, master]
permissions:
  contents: read
jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify complete Git history
        run: git fsck --full --no-reflogs --no-dangling
      - name: Check contribution whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEGACY_BASELINE: 291ddccda847e4f4ccb273bb26121a0a0d738164
        run: |
          # Bootstrap imports already-published master history. Check new
          # contributions after that fixed baseline, not historical whitespace.
          if git merge-base --is-ancestor "$BASE_SHA" "$LEGACY_BASELINE"; then
            BASE_SHA="$LEGACY_BASELINE"
          fi
          git diff --check "$BASE_SHA...$HEAD_SHA" -- . ':!worktrees' 
      - name: Verify project attribution
        run: test -s LICENSE
