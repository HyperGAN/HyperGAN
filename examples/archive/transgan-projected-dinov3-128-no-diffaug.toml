# TransGAN section 3.4 recipe with a frozen projected DINOv3 critic.
# Paper 128px generator: depths 5/4/4/4/4, latent width 512, raw RGB output.
# DiffAug disabled; relative position bias and PixelNorm retained.
# Everything else, including optimizer, loss, batch size and seeds, matches stable.
# "stable" names the candidate recipe; convergence has not been established.
# Set the pinned dataset manifest and local pretrained checkpoint below.
format = "hypergan-model/1"
name = "images/logos-transgan-projected-dinov3-128-no-diffaug"

[data]
factory = "hypergan.colorization_data:ColorizationData"

[data.args]
root = "./data/logos256"
manifest = "./dataset-manifest-128.json"
manifest_sha256 = "REPLACE_WITH_MANIFEST_SHA256"
split = "train"
shuffle = true

[networks.generator]
role = "generator"
inputs = { z = "latent" }
hndl = "networks/transgan-generator-128-stable.hndl"
input_shape = ["B", 512]
output_shape = ["B", 3, 128, 128]

[networks.discriminator]
role = "critic"
inputs = { x = "candidate" }
hndl = "networks/dinov3-projected-discriminator-128-no-diffaug.hndl"
input_shape = ["B", 3, 128, 128]
output_shape = ["B", 4, 4, 4]

[networks.discriminator.args.parameters]
weights_path = "/path/to/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"
weights_sha256 = "08c60483bc63c04f533611e34bf70b120eedb7240f469bc16e9e20bf344b941d"

[networks.discriminator.args.pretrained_providers.dinov3_vits16]
source_path = "/path/to/dinov3-source"
source_commit = "6876159a11b4df116f30f667f8c9888617df0751"

[prior]
kind = "mog"
initialization_device = "cpu"
initialization_seed = 25003
num_particles = 4096
z_dim = 512
sigma_rel = 0.025

[penalty]
kappa = 1.0
lazy_k = 8

[train]
steps = 200000
batch_size = 64
seed = 25002
device = "cuda"
ema = 0.995
lr_anneal_start = 0.6
lr_floor = 1.0
phase_draws = "independent"
data_rng_device = "cpu"
data_seed_offset = 2
prior_seed_offset = 3
implementation = "torch_fused_adam"
lr = 0.0002
d_lr_mult = 1.0
prior_lr_mult = 10.0
betas = [0.5, 0.999]
prior_betas = [0.5, 0.999]

[train.backend]
deterministic_algorithms = false
cudnn_deterministic = false
cudnn_benchmark = true
matmul_allow_tf32 = true
cudnn_allow_tf32 = true

[sampling]
count = 16
seed = 35002

[metrics]
preset = "standard"
every_steps = 10

[[losses]]
type = "adversarial"
critic = "discriminator"
weight = 1.0
penalty = 1.0

[[losses]]
type = "prior"
rows = "full"
weight = 1.0
target_std = 1.0
eps = 0.0001
