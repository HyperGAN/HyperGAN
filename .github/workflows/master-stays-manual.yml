name: Master stays manual

# GitHub's allow-auto-merge setting is repository-wide. This turns auto-merge
# back off for any pull request whose base branch is master.
on:
  pull_request_target:
    types: [auto_merge_enabled, edited]
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  disable-auto-merge:
    name: Disable auto-merge into master
    if: github.event.pull_request.auto_merge != null
    runs-on: ubuntu-latest
    steps:
      - name: Turn off auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/pulls/${PR}/auto_merge"
          gh pr comment "$PR" --body "Auto-merge is off for pull requests into master. Merge this by hand once the checks pass."
